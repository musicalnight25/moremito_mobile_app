name: more_mitro_app
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.3

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^4.0.6
#  dio_http_cache: ^0.3.0
  connectivity_plus: ^6.0.5
  get:
  flutter_svg: ^2.0.10+1
  flutter_screenutil: ^5.8.4
  lottie: ^3.1.2
  cached_network_image: ^3.2.0
  path_provider: ^2.1.4
  permission_handler: ^11.3.1
  shimmer: ^3.0.0
  shared_preferences: ^2.2.3
  image_picker: ^1.1.2
  file_picker: ^8.0.5
#  firebase_core: ^3.4.0
  firebase_core: ^3.12.0
  intl: ^0.19.0
  flutter_local_notifications: ^17.2.2
  firebase_messaging:
  chewie: ^1.10.0
  flutter_inappwebview: ^6.0.0
  share_plus: ^10.1.4
  audioplayers: ^6.1.2
  photo_view:
  url_launcher:
  flutter_contacts:
  hive:
  hive_flutter:



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_native_splash: ^2.4.1
  hive_generator: ^2.0.0
  build_runner: ^2.3.3

flutter_native_splash:
  android: true
  ios: true
  web: false

  # Remove background_image if using gradient
  color: "#e5f3d5"
  color_dark: "#e5f3d5"

  # Use a solid image or transparent for icons
  image: "assets/images/splash_logo.png"
  image_dark: "assets/images/splash_logo.png"

  # Android 12-specific settings
  android_12:
    image: "assets/images/splash_logo.png"
    image_dark: "assets/images/splash_logo.png"
    color: "#e5f3d5"
    color_dark: "#e5f3d5"

  # Gradient customization (optional)
  fullscreen: true

#  flutter pub run flutter_native_splash:remove
#  flutter pub run flutter_native_splash:create

# The following section is specific to Flutter packages.
flutter:

  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/json/
    - assets/images/
    - google_fonts/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  fonts:
    - family: Manrope
      fonts:
        - asset: google_fonts\Manrope-Bold.ttf
          weight: 700
        - asset: google_fonts\Manrope-Medium.ttf
        - asset: google_fonts\Manrope-Regular.ttf
          weight: 400
        - asset: google_fonts\Manrope-SemiBold.ttf
          weight: 600
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages
 