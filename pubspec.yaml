name: more_mitro_app
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+10


environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^4.0.6
  connectivity_plus: ^6.0.5
  get:
  flutter_svg: ^2.0.10+1
  flutter_screenutil: ^5.9.3
  lottie: ^3.1.2
  cached_network_image: ^3.2.0
  path_provider: ^2.1.4
  permission_handler: ^11.3.1
  shimmer: ^3.0.0
  shared_preferences: ^2.2.3
  image_picker: ^1.1.2
  file_picker: ^8.0.5
  firebase_core: ^3.12.0
  intl: ^0.19.0
  flutter_local_notifications: ^17.2.2
  firebase_messaging:
  chewie: ^1.10.0
  flutter_inappwebview: ^6.0.0
  share_plus: ^10.1.4
  audioplayers: ^6.1.2
  photo_view:
  url_launcher:
  flutter_contacts:
  hive:
  hive_flutter:
  firebase_remote_config: ^5.5.0
  device_info_plus: ^12.2.0
  flutter_widget_from_html_core:
  dropdown_button2: ^2.3.9
  just_audio: ^0.10.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.1
  hive_generator: ^2.0.0
  build_runner: ^2.3.3
  flutter_native_splash: ^2.4.0   # ✅ added here
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/ios_logo.jpg"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/ios_logo.jpg"
  min_sdk_android: 21

flutter_native_splash:
  ios: true
  android: false
  web: false
  color: "#FFFFFF"
  image: assets/images/logo.png
  color_dark: "#FFFFFF"
  image_dark: assets/images/logo.png
  android_12:
    image: assets/images/logo.png
    icon_background_color: "#FFFFFF"

flutter:
  uses-material-design: true

  assets:
    - assets/json/
    - assets/images/
    - google_fonts/

  fonts:
    - family: Manrope
      fonts:
        - asset: google_fonts/Manrope-Bold.ttf
          weight: 700
        - asset: google_fonts/Manrope-Medium.ttf
        - asset: google_fonts/Manrope-Regular.ttf
          weight: 400
        - asset: google_fonts/Manrope-SemiBold.ttf
          weight: 600
