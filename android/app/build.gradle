plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '1'
def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '1.0'

// ========== KEYSTORE AUTO HANDLING ==========
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
def hasSigning = false

if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))

    if (keystoreProperties['storeFile'] && file(keystoreProperties['storeFile']).exists()) {
        hasSigning = true
        println "➡️ Using release keystore"
    } else {
        println "❌ key.properties exists but .jks missing. Falling back!"
    }
} else {
    println "❌ key.properties missing. Falling back!"
}
// ============================================

android {
    namespace = "com.moremito.app"
    compileSdk = 35
    ndkVersion = "27.0.12077973"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.moremito.app"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = 21
        versionName = "2.0.21"
    }

    signingConfigs {
        debug {}

        if (hasSigning) {
            release {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // use release keystore if exists, otherwise use debug signature
            signingConfig hasSigning ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8"
    implementation 'com.google.android.exoplayer:exoplayer:2.19.1'
    implementation platform('com.google.firebase:firebase-bom:32.2.3')
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"
}
